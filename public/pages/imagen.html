<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analizar Imagen</title>
    <link rel="stylesheet" href="/css/index.css" />
  </head>

  <body>
    <div class="container">
      <h1>Análisis de Imagen</h1>

      <form action="" id="form-imagen" class="form-group">
        <input
          type="text"
          id="url-imagen"
          placeholder="URL de la imagen"
          autocomplete="off"
        />
        <button type="submit" class="btn">Analizar</button>
      </form>

      <div id="resultado">
        <img src="" alt="" id="imagen" />
        <p id="descripcion"></p>
        <p id="confianza"></p>
      </div>

      <div class="buttons" style="margin-top: 30px">
        <a class="btn" href="/">&larr; Volver al Inicio</a>
      </div>
    </div>

    <script src="../js/imagenScript.js"></script>
  </body>
</html>
