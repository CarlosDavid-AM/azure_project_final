<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat IA</title>
    <link rel="stylesheet" href="/css/index.css" />
  </head>

  <body>
    <div class="container">
      <h1>Chat con IA</h1>

      <div id="chat-box"></div>

      <form action="" id="form-chat" class="form-group">
        <input
          type="text"
          id="input-pregunta"
          placeholder="Escribe tu pregunta aquí..."
          autocomplete="off"
          style="width: 400px"
        />
        <button type="button" class="btn">Enviar</button>
      </form>

      <div class="buttons" style="margin-top: 30px">
        <a class="btn" href="/">&larr; Volver al Inicio</a>
      </div>
    </div>

    <script src="../js/chat.js"></script>
  </body>
</html>
